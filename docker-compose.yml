version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mastery
      POSTGRES_PASSWORD: mastery
      POSTGRES_DB: mastery_pulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastery -d mastery_pulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

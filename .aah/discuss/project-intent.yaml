raw_statement: >
  As a learner I should be able to edit the name of my active profile so that I can give
  it any name of my choice after the original name was assigned at the time of profile
  creation. I shouldn't be allowed to edit any other fields of my active profile. Only a
  pencil icon should appear in front of the profile name for editing.

improvement_type: enhancement

target_areas:
  - backend-api        # New or modified endpoint: allow name-only patch on locked/active profiles
  - frontend-ui        # Pencil icon inline edit for profile name — only in the active profile view
  - access-control     # Only the learner themselves can rename their own active profile

constraints:
  - Only the profile name field is editable — no other fields (cert, questionnaire, skill ratings)
  - Editing is only allowed on the active profile
  - A pencil icon (not a button label) is the sole entry point for editing
  - The profile must remain locked — name change does not unlock or alter skill/cert data
  - No browser storage (localStorage/sessionStorage) — all state via TanStack Query + server

technical_domains:
  - api       # Backend: PATCH route for name-only on locked profile
  - frontend  # Inline edit UX with pencil icon, optimistic update, TanStack Query invalidation

integration_surface: 0   # Internal only — no external systems

process_flow:
  - Learner views their active profile (SkillRadar or profile page)
  - A pencil icon appears immediately before/beside the profile name
  - Learner clicks pencil icon — name text becomes an editable input field
  - Learner types a new name and confirms (Enter key or Save button)
  - Frontend calls PATCH endpoint with only the name field
  - Backend validates name (not empty, within 500 char limit) and persists
  - TanStack Query invalidates the profile cache; UI refreshes with new name
  - If the learner presses Escape or clicks away, the edit is cancelled

end_users:
  - Practitioner / Learner (the profile owner — the one who can rename)

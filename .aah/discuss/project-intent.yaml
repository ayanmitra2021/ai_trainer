raw_statement: >
  As an admin, I want to deactivate or re-activate a particular learner from the portal
  so that they can't access the portal the next time during their login.

improvement_type: enhancement

target_areas:
  - admin-ui              # Frontend admin page/component to view and toggle learner status
  - auth-enforcement      # Login flow must block deactivated learners at authentication time
  - backend-api           # PATCH /practitioners endpoint — toggle active/inactive state
  - data-model            # Representation of active/inactive state (is_active flag vs deleted_at vs dedicated status column)
  - audit-trail           # Record of who deactivated/reactivated, and when

constraints:
  - Must integrate with existing FastAPI / React / PostgreSQL stack (no new runtime dependencies without justification)
  - Deactivation must be enforced at login time — a deactivated learner cannot log in
  - Re-activation must be possible by an admin (reversible operation)
  - Admin-only operation — practitioners cannot deactivate themselves or peers
  - Multi-tenancy aware — admin can only manage learners within their own organization

technical_domains:
  - api        # Backend route changes (PATCH /practitioners)
  - frontend   # Admin portal UI for learner management
  - data       # Schema / ORM changes (active state persistence)
  - auth       # Session creation guard (deny login if deactivated)

integration_surface: 1   # Internal — the existing practitioners route and auth flow; no new external systems

process_flow:
  - Admin logs in via /api/v1/auth/admin-login
  - Admin navigates to learner management view (new frontend page or section of existing admin page)
  - Admin finds a specific learner (by name/email) and toggles their status (deactivate or re-activate)
  - System calls PATCH /api/v1/practitioners/{id} to update status
  - Next time the deactivated learner attempts login, the auth route returns an error
  - Admin can reverse the action (re-activate) to restore portal access

end_users:
  - Admin (portal administrator within an organization)
  - Practitioner / Learner (affected — cannot log in when deactivated)

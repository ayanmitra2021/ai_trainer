rules:
- id: PY-SEC-001
  category: security
  priority: critical
  description: No hardcoded credentials, API keys, tokens, or secrets in source code.
    This includes passwords, connection strings, and signing keys.
  remediation: Use environment variables, a .env file excluded from version control,
    or a secrets manager (e.g., AWS Secrets Manager, HashiCorp Vault).
  source: industry-default
- id: PY-SEC-002
  category: security
  priority: critical
  description: Never use string formatting, concatenation, or f-strings to build SQL
    queries. This includes format(), %, f'', and + operators inside execute() calls.
  remediation: Use SQLAlchemy ORM, parameterized queries with bind parameters, or
    prepared statements.
  source: industry-default
- id: PY-SEC-003
  category: security
  priority: critical
  description: Validate and sanitize all external input — user input, API parameters,
    query strings, headers, file uploads, and webhook payloads.
  remediation: Use Pydantic models, marshmallow schemas, or cerberus for input validation
    at the boundary.
  source: industry-default
- id: TS-SEC-001
  category: security
  priority: critical
  description: No hardcoded credentials, API keys, tokens, or secrets in source code
    or client-side bundles.
  remediation: Use environment variables with typed config objects, or a secrets manager.
  source: industry-default
- id: TS-SEC-002
  category: security
  priority: critical
  description: 'Prevent XSS: never insert unsanitized user input into innerHTML or
    dangerouslySetInnerHTML.'
  remediation: Use textContent, sanitize with DOMPurify, or use framework-provided
    escaping.
  source: industry-default
- id: FA-SEC-001
  category: security
  priority: critical
  description: CORS must be configured with explicit allowed origins. Never use allow_origins=['*']
    in production. Allow only specific, known frontend domains.
  remediation: Set allow_origins to a list of specific domains loaded from environment
    config.
  source: industry-default
- id: FA-SEC-002
  category: security
  priority: critical
  description: Protect sensitive endpoints with authentication middleware. Use OAuth2PasswordBearer
    or API key dependency for all non-public routes.
  remediation: Add security dependency via Depends(get_current_user) or Depends(verify_api_key)
    to protected routes.
  source: industry-default
- id: RX-SEC-001
  category: security
  priority: critical
  description: Never use dangerouslySetInnerHTML with unsanitized user input. If HTML
    rendering is required, sanitize with DOMPurify first.
  remediation: Use DOMPurify.sanitize(userInput) before passing to dangerouslySetInnerHTML,
    or avoid it entirely.
  source: industry-default
- id: RX-SEC-002
  category: security
  priority: critical
  description: Never store secrets, API keys, or tokens in client-side code, localStorage,
    or sessionStorage. Use httpOnly cookies for auth tokens.
  remediation: Move secrets to server-side. Store auth tokens in httpOnly, secure,
    sameSite cookies.
  source: industry-default
- id: PG-SEC-001
  category: security
  priority: critical
  description: Always use parameterized queries or ORM methods. Never concatenate
    user input into SQL strings, even for table/column names.
  remediation: Use bind parameters ($1, %s) or ORM query builders. For dynamic identifiers,
    use a whitelist.
  source: industry-default
- id: PY-SEC-004
  category: security
  priority: high
  description: Do not use pickle, eval(), exec(), or __import__() on untrusted data.
    These allow arbitrary code execution.
  remediation: Use JSON, MessagePack, or Protocol Buffers for serialization. Use ast.literal_eval()
    for safe evaluation of literals.
  source: industry-default
- id: PY-TEST-001
  category: testing
  priority: high
  description: New feature code must have at least 80% line coverage with functional
    tests. No mock frameworks allowed — all tests must run against real services.
  remediation: Add functional tests covering public functions, edge cases, and error
    paths. Use real database, real API calls.
  source: industry-default
- id: PY-ERR-001
  category: error_handling
  priority: high
  description: Never use bare 'except:' or 'except Exception:' as a catch-all. Always
    catch specific exception types.
  remediation: Replace bare except with specific exceptions (ValueError, KeyError,
    ConnectionError, etc.).
  source: industry-default
- id: TS-TYPE-001
  category: type_safety
  priority: high
  description: Never use 'any' type. Use 'unknown' for truly unknown types and narrow
    with type guards.
  remediation: Replace 'any' with specific types, union types, generics, or 'unknown'
    with runtime checks.
  source: industry-default
- id: TS-TYPE-002
  category: type_safety
  priority: high
  description: 'Enable strict mode in tsconfig.json: strict: true (includes strictNullChecks,
    noImplicitAny, strictFunctionTypes).'
  remediation: 'Set "strict": true in tsconfig.json compilerOptions.'
  source: industry-default
- id: TS-TEST-001
  category: testing
  priority: high
  description: New feature code must have at least 80% line coverage with functional
    tests. No mock frameworks allowed.
  remediation: Add functional tests with real services. Use type-safe test utilities.
  source: industry-default
- id: TS-ERR-001
  category: error_handling
  priority: high
  description: Define typed error classes instead of throwing plain strings or generic
    Error. Use Result types for recoverable failures.
  remediation: Create custom error classes extending Error, or use a Result<T, E>
    pattern.
  source: industry-default
- id: FA-ARCH-001
  category: architecture
  priority: high
  description: Use FastAPI Depends() for all shared resources — database sessions,
    auth, configuration, external clients. Never use module-level globals for stateful
    resources.
  remediation: Create dependency functions and inject via Depends() in route parameters.
  source: industry-default
- id: FA-ARCH-002
  category: architecture
  priority: high
  description: Use Pydantic BaseModel for all request bodies, response schemas, and
    configuration. Never accept raw dict or untyped JSON.
  remediation: Define Pydantic models for every request/response shape and use them
    as route parameter types.
  source: industry-default
- id: RX-ARCH-001
  category: architecture
  priority: high
  description: 'Follow React hooks rules: only call hooks at the top level (never
    inside loops, conditions, or nested functions). Only call hooks from React function
    components or custom hooks.'
  remediation: Move hook calls to the top level of the component function. Extract
    conditional logic below the hook calls.
  source: industry-default
- id: RX-ARCH-002
  category: architecture
  priority: high
  description: Components should be small and focused on one responsibility. Extract
    reusable UI into shared components. Keep business logic out of components — use
    custom hooks or service modules.
  remediation: Split large components. Move data fetching to custom hooks. Move business
    logic to utility modules.
  source: industry-default
- id: RX-A11Y-001
  category: accessibility
  priority: high
  description: All interactive elements must be keyboard accessible. Use semantic
    HTML (button, a, input) instead of div/span with onClick. Add aria-label for icon-only
    buttons.
  remediation: Replace <div onClick> with <button>. Add aria-label, role, and tabIndex
    where needed.
  source: industry-default
- id: PG-SEC-002
  category: security
  priority: high
  description: Use least-privilege database roles. Application should connect with
    a role that has only SELECT/INSERT/UPDATE/DELETE — not SUPERUSER, CREATEDB, or
    DROP.
  remediation: Create a dedicated application role with GRANT only on needed tables
    and operations.
  source: industry-default
- id: PG-PERF-001
  category: performance
  priority: high
  description: Add indexes on columns used in WHERE, JOIN, and ORDER BY clauses for
    tables expected to exceed 10,000 rows. Include foreign key columns.
  remediation: Add CREATE INDEX on frequently queried columns. Use EXPLAIN ANALYZE
    to verify index usage.
  source: industry-default
- id: PG-PERF-002
  category: performance
  priority: high
  description: Use connection pooling (PgBouncer, SQLAlchemy pool, asyncpg pool).
    Never open a new connection per request.
  remediation: Configure connection pool with appropriate pool_size (5-20) and max_overflow.
    Use pool_pre_ping for stale connection detection.
  source: industry-default
- id: PG-DATA-001
  category: data_integrity
  priority: high
  description: Use database-level constraints (NOT NULL, UNIQUE, CHECK, FOREIGN KEY)
    to enforce data integrity. Do not rely solely on application-level validation.
  remediation: Add constraints in migrations. Use NOT NULL, UNIQUE, CHECK constraints,
    and FOREIGN KEY references.
  source: industry-default
- id: PG-DATA-002
  category: data_integrity
  priority: high
  description: Wrap multi-step data modifications in explicit transactions. Use SAVEPOINT
    for partial rollback in complex workflows.
  remediation: Use BEGIN/COMMIT/ROLLBACK or ORM transaction context managers for multi-statement
    operations.
  source: industry-default
- id: PY-ERR-002
  category: error_handling
  priority: medium
  description: Do not silently swallow exceptions with empty except blocks. At minimum,
    log the error.
  remediation: Add logging.exception() or logging.error() inside except blocks, or
    re-raise with context.
  source: industry-default
- id: PY-PERF-001
  category: performance
  priority: medium
  description: Use async/await for I/O-bound operations when running in an async framework
    (FastAPI, aiohttp). Do not call synchronous I/O (requests, time.sleep, open())
    inside async functions.
  remediation: Use httpx.AsyncClient, asyncio.sleep(), aiofiles, or run_in_executor()
    for blocking calls.
  source: industry-default
- id: PY-PERF-002
  category: performance
  priority: medium
  description: Avoid loading entire datasets into memory. Use generators, iterators,
    or streaming for large data processing.
  remediation: Use yield, itertools, or database cursors with fetchmany() instead
    of fetchall().
  source: industry-default
- id: TS-TYPE-003
  category: type_safety
  priority: medium
  description: Use discriminated unions instead of optional properties for mutually
    exclusive states. Avoid boolean flags that create invalid states.
  remediation: Model states as union types with a literal discriminant field.
  source: industry-default
- id: FA-PERF-001
  category: performance
  priority: medium
  description: Use async def for all route handlers that perform I/O (database, HTTP,
    file). Do not mix sync blocking calls inside async routes.
  remediation: Convert route handlers to async def and use async database drivers
    (asyncpg, motor) and async HTTP clients (httpx).
  source: industry-default
- id: FA-PERF-002
  category: performance
  priority: medium
  description: Use connection pooling for database connections. Configure pool_size
    and max_overflow in SQLAlchemy create_engine or use asyncpg pool.
  remediation: Set pool_size=5, max_overflow=10 in engine config, or use asyncpg.create_pool().
  source: industry-default
- id: RX-A11Y-002
  category: accessibility
  priority: medium
  description: All images must have meaningful alt text. Decorative images should
    have alt=''. Form inputs must have associated labels.
  remediation: Add alt attributes to <img>. Add <label htmlFor> for every <input>.
  source: industry-default
- id: RX-PERF-001
  category: performance
  priority: medium
  description: Avoid unnecessary re-renders. Use React.memo for expensive pure components,
    useMemo for expensive computations, and useCallback for callback props.
  remediation: Wrap expensive components in React.memo(). Use useMemo/useCallback
    where profiling shows wasted renders.
  source: industry-default
- id: PG-PERF-003
  category: performance
  priority: medium
  description: Avoid SELECT * in production queries. Select only the columns needed
    to reduce data transfer and allow covering indexes.
  remediation: 'Replace SELECT * with explicit column list: SELECT id, name, email
    FROM users.'
  source: industry-default
- id: PY-CONV-001
  category: conventions
  priority: low
  description: 'Follow PEP 8 naming: snake_case for functions, methods, and variables;
    PascalCase for classes; UPPER_SNAKE_CASE for module-level constants.'
  remediation: Rename identifiers to match PEP 8 conventions.
  source: industry-default
- id: PY-CONV-002
  category: conventions
  priority: low
  description: Use type hints for all public function parameters and return values.
    Internal/private helpers may omit hints.
  remediation: Add type annotations using built-in types (list, dict, str) or typing
    module.
  source: industry-default
- id: PY-CONV-003
  category: conventions
  priority: low
  description: 'Organize imports in three groups separated by blank lines: stdlib,
    third-party, local. Use absolute imports.'
  remediation: Reorder imports following PEP 8 / isort conventions.
  source: industry-default
- id: TS-CONV-001
  category: conventions
  priority: low
  description: Use camelCase for variables/functions, PascalCase for classes/interfaces/types/enums,
    UPPER_SNAKE_CASE for constants.
  remediation: Rename identifiers to match TypeScript conventions.
  source: industry-default

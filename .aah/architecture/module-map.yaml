# module-map.yaml — Mastery Pulse Frontend UI/UX Remediation
# Iteration 1 · delivery_intent: prod · project_type: brownfield
# Generated by: /aah-arch — 2026-08-31
#
# Scope: Pure frontend UX remediation — 6 independently demoable modules.
# No backend changes. No cloud services. No schema migrations.
# All layers are ui/ux (React + TypeScript + CSS).

modules:

  - id: MOD-000
    name: brownfield-baseline
    description: "Existing Mastery Pulse frontend boots and runs cleanly with no TypeScript errors
      or test regressions. Establishes the green baseline that each subsequent module must preserve."
    demo_criteria: "npm run build completes with zero TypeScript errors; app serves at localhost:5173;
      LoginPage, NavBar, and an authenticated page all load without console errors."
    smoke_test: "cd frontend && npm run build && npm run dev"
    layers:
      ui/ux:
        - frontend/package.json
        - frontend/tsconfig.json
        - frontend/vite.config.ts
        - frontend/src/main.tsx
        - frontend/src/App.tsx
    depends_on: []
    cloud_services: []

  - id: MOD-001
    name: wcag-accessibility-sprint
    description: "Adds all missing ARIA attributes, form label bindings, skip-to-main link,
      and live region announcements across LoginPage, App.tsx, QuizRunner, and RequireAuth
      so the application passes WCAG 2.1 AA (SC 1.3.1, 2.4.1, 2.4.6, 4.1.2, 4.1.3)."
    demo_criteria: "axe-core audit of LoginPage, NavBar, and QuizRunner returns 0 critical/serious
      violations; screen reader (NVDA/VoiceOver) announces login form labels, error messages,
      accordion state, and loading spinner; skip-to-main link is focusable before NavBar."
    smoke_test: "npx axe-cli http://localhost:5173/login http://localhost:5173/quiz"
    layers:
      ui/ux:
        - frontend/src/App.tsx          # skip-to-main link, aria-label on <nav>, RequireAuth spinner
        - frontend/src/pages/LoginPage.tsx    # id/htmlFor bindings, aria-describedby, role=alert
        - frontend/src/components/QuizRunner/QuizRunner.tsx   # aria-expanded, aria-controls on accordion
        - frontend/src/index.css        # .skip-link visually-hidden + focus styles
    depends_on: [MOD-000]
    cloud_services: []

  - id: MOD-002
    name: design-token-consistency
    description: "Migrates LoginPage from inline JS style objects to global CSS class names
      (.form-control, .btn-primary, .login-card); unifies PortalLayout ring/glow colors to
      CSS variable palette; fixes hardcoded error hex values to CSS vars so dark mode works."
    demo_criteria: "LoginPage renders identically in light and dark mode using only global CSS classes;
      PortalLayout rings display indigo/violet matching the site palette (no stale light-blue);
      login error state background/color adapts correctly to dark mode via var(--danger)."
    smoke_test: "Toggle data-theme=dark in DevTools and verify LoginPage + PortalLayout color
      consistency; confirm no inline style attributes remain on LoginPage form elements."
    layers:
      ui/ux:
        - frontend/src/pages/LoginPage.tsx    # remove inputStyle/labelStyle/btnStyle, add CSS classes
        - frontend/src/components/PortalLayout/PortalLayout.tsx  # rgba(77,171,247) → var(--primary)
        - frontend/src/index.css        # add .login-card, .login-card__header utility classes
    depends_on: [MOD-000]
    cloud_services: []

  - id: MOD-003
    name: route-code-splitting
    description: "Wraps all 16 statically-imported page components in React.lazy() with Suspense
      fallbacks, and adds dynamic import() for Three.js-heavy route components, eliminating the
      monolithic initial bundle and reducing first-paint wait time."
    demo_criteria: "Vite build output shows 16+ named route chunks; Chrome DevTools Network tab
      shows lazy chunks loading on navigation rather than at initial load; Three.js vendor chunk
      only loads when a 3D route is visited; LCP improves vs. baseline."
    smoke_test: "npm run build -- --report; open dist/assets/ and confirm multiple small JS chunks
      plus a separate three-vendor chunk."
    layers:
      ui/ux:
        - frontend/src/App.tsx          # React.lazy() + Suspense wrapper for all 16 imports
    depends_on: [MOD-000]
    cloud_services: []

  - id: MOD-004
    name: mobile-responsive-design
    description: "Replaces the fixed 380px login card with a fluid max-width layout safe on screens
      <400px; adds a hamburger toggle + slide-out nav drawer for viewports <640px so the full
      navigation is accessible on phones and tablets."
    demo_criteria: "At 375px viewport width: LoginPage card fits without horizontal scroll;
      NavBar collapses to hamburger button; tapping hamburger opens full nav drawer with all links;
      drawer closes on link selection or outside tap."
    smoke_test: "Chrome DevTools → Toggle device toolbar → iPhone SE (375×667); verify login card
      and nav behavior."
    layers:
      ui/ux:
        - frontend/src/pages/LoginPage.tsx    # width: 380 → min(380px, 100% - 2rem)
        - frontend/src/App.tsx          # hamburger toggle state, NavBar responsive collapse
        - frontend/src/index.css        # @media (max-width: 640px) nav styles, .nav-drawer
    depends_on: [MOD-002]
    cloud_services: []

  - id: MOD-005
    name: navigation-ia
    description: "Creates a 404 Not Found page wired as the catch-all route; adds a reusable
      Breadcrumb component driven by React Router v6 useMatches() that renders above page content
      on all deep practitioner and admin routes."
    demo_criteria: "Navigating to /invalid-path shows the 404 NotFoundPage with a back-to-home link;
      /profile/123/skills shows a breadcrumb trail 'Home > Profile > Skills'; /admin/practitioners/456
      shows 'Home > Practitioners > Practitioner Detail'."
    smoke_test: "Navigate to /nonexistent in the dev server; navigate to a deep route and verify
      breadcrumb renders above page title."
    layers:
      ui/ux:
        - frontend/src/pages/NotFoundPage.tsx       # new file
        - frontend/src/components/Breadcrumb/Breadcrumb.tsx   # new file — useMatches-driven
        - frontend/src/App.tsx          # catch-all <Route path="*">, handle.breadcrumb on deep routes
        - frontend/src/components/PortalLayout/PortalLayout.tsx  # render <Breadcrumb /> above content
    depends_on: [MOD-000]
    cloud_services: []

  - id: MOD-006
    name: i18n-infrastructure
    description: "Adds react-intl as the i18n layer; creates src/messages/en-US.ts as the canonical
      message catalog; wraps App in IntlProvider; extracts all user-visible hardcoded strings from
      LoginPage, QuizRunner, and App.tsx into the catalog."
    demo_criteria: "All user-visible strings in LoginPage, QuizRunner header, and NavBar links
      are served from the en-US message catalog; adding a test key to the catalog and referencing it
      in a component renders correctly; IntlProvider is mounted at app root."
    smoke_test: "Add a canary key to en-US.ts; reference it in LoginPage; verify it renders in the
      running app."
    layers:
      ui/ux:
        - frontend/src/messages/en-US.ts            # new file — full message catalog
        - frontend/src/main.tsx         # IntlProvider wrapper
        - frontend/src/pages/LoginPage.tsx    # <FormattedMessage> / useIntl replacement
        - frontend/src/components/QuizRunner/QuizRunner.tsx   # string extraction
        - frontend/src/App.tsx          # NavBar link labels → catalog
    depends_on: [MOD-001, MOD-002]
    cloud_services: []

# module-map.yaml — Mastery Pulse Profile Name Editing
# Iteration 1 · delivery_intent: prod · project_type: brownfield
# Generated by: /aah-plan (inline, no separate architecture phase) — 2026-09-10
#
# Scope: Brownfield enhancement — allow learners to rename their active profile.
# 2 modules: backend API carve-out + frontend inline edit.
# No schema migrations needed (name column already exists).
# No cloud services. No agent changes.

modules:

  - id: MOD-001
    name: profile-name-api
    description: >
      New dedicated endpoint PATCH /api/v1/practitioners/{practitioner_id}/profiles/{profile_id}/name
      that allows a learner to rename their own active profile, bypassing the is_locked gate
      (which currently blocks all PATCH edits on locked profiles). The rest of the profile
      lock is entirely untouched. Validates: practitioner session owns the profile,
      profile is active, name is 1–500 non-empty characters (trimmed). No Alembic migration
      needed — PractitionerProfile.name already exists.
    demo_criteria: >
      PATCH /api/v1/practitioners/{id}/profiles/{profile_id}/name with a valid name returns 200
      and the updated profile; calling with is_locked=True profile (not belonging to the caller)
      returns 403; calling with name="" returns 422; calling on a non-active profile returns 404.
    smoke_test: "py -m pytest backend/tests/scenarios/test_profile_name_edit.py -v"
    layers:
      api:
        - backend/app/api/routes/profiles.py   # new route: PATCH /{profile_id}/name
        - backend/app/schemas/profiles.py      # new schema: ProfileNameUpdate
    depends_on: []
    cloud_services: []

  - id: MOD-002
    name: profile-name-ui
    description: >
      Pencil icon + inline edit for the profile name in SkillRadar.tsx (~line 934).
      The profile name text becomes an inline <input> when the pencil icon is clicked.
      Enter/blur saves; Escape cancels. Uses TanStack Query v5 optimistic update via
      useUpdateProfileName mutation hook: onMutate snapshots the old name, onSuccess
      invalidates the profiles query cache, onError rolls back and shows an error toast.
      No localStorage/sessionStorage — all state via component useState + TanStack Query.
    demo_criteria: >
      Clicking the pencil icon beside the profile name in SkillRadar turns it into an
      inline input; typing and pressing Enter saves and shows the new name immediately;
      Escape restores the old name; clicking away (blur) saves; a simulated API error
      shows a toast and restores the old name.
    smoke_test: "cd frontend && npm run build"
    layers:
      ui/ux:
        - frontend/src/components/SkillRadar/SkillRadar.tsx  # inline edit + pencil icon at ~line 934
        - frontend/src/hooks/index.ts                        # useUpdateProfileName mutation
        - frontend/src/api/index.ts                          # profiles.updateName API call
    depends_on: [MOD-001]
    cloud_services: []

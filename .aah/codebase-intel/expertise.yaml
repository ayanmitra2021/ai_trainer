tech_patterns:
  multi_tier_llm_client:
    tool: "anthropic + openai SDKs via MultiTierModelClient"
    pattern: "3-tier fallback chain (NVIDIA Ultra → Lightning → Haiku in NVIDIA mode; Haiku → Ultra → Lightning in ANTHROPIC mode) with NvidiaCircuitBreaker that trips after 5 consecutive both-NVIDIA-fail calls."
    injection: "call create_model_client() — NEVER create_haiku_only_client() — and pass result to Agent.run()"

  structured_outputs:
    tool: "anthropic messages.parse() / NVIDIA NIM JSON mode"
    pattern: "Every agent defines a Pydantic output_model; parse() enforces the schema. NVIDIA path strips <think> blocks and normalises trailing ':' in JSON keys before Pydantic validation."
    injection: "Agent subclass sets output_model = SomeOutput; base.py calls client.messages.parse(output_format=output_model)"

  prompt_file_pattern:
    tool: "pathlib + markdown files"
    pattern: "Each agent's system prompt lives at agents/prompts/<agent_name>.md, loaded once at Agent instantiation via PROMPTS_DIR / f'{self.name}.md'. Never inline in Python."
    injection: "base.py reads the file at __init__ time; subclasses set self.name matching the .md filename"

  async_sqlalchemy:
    tool: "SQLAlchemy 2.0 async + asyncpg / aiosqlite"
    pattern: "All DB access via AsyncSession from get_db() dependency. Models use Mapped[] + mapped_column(). sa.JSON for cross-database compat (JSONB in DDL, sa.JSON in ORM)."
    injection: "FastAPI Depends(get_db) injects AsyncSession into routes; agents receive it from their callers"

  session_cookie_auth:
    tool: "server-side sessions + HttpOnly cookie"
    pattern: "Browser holds only an opaque UUID session-id cookie. Server validates against sessions table. identity_type discriminator ('practitioner'|'admin'|'product_admin') routes to the correct user row."
    injection: "get_session() / require_admin() / require_product_admin() FastAPI dependencies in api/deps/session.py"

integrations:
  - "Anthropic API (https://api.anthropic.com): Claude Haiku 4.5 structured outputs via anthropic SDK >= 0.40; primary in ANTHROPIC mode, Tier 3 Haiku fallback in NVIDIA mode."
  - "NVIDIA NIM API (https://integrate.api.nvidia.com/v1): Nemotron Ultra 253B + Lightning 70B via OpenAI-compatible endpoint; primary Tier 1+2 in NVIDIA mode."
  - "MCP stdio servers (local process): learning_portal/server.py and usage_signals/server.py adapt internal data sources via the MCP protocol; no public HTTPS endpoint."
  - "PostgreSQL + pgvector: primary data store; pgvector provisioned but not yet active for vector search."


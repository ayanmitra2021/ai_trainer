flow_traces:
  - name: "agent_run_happy_path"
    description: "How a successful agent invocation flows from caller to DB"
    steps:
      - "caller (route/workflow) constructs TInput Pydantic model"
      - "caller calls agent.run(input, db_session, model_client)"
      - "base.py:Agent.run() loads system prompt from prompts/<name>.md"
      - "base.py calls _build_messages(input) on the subclass"
      - "base.py calls model_client.parse(model=self.model, system=prompt, messages=..., output_format=self.output_model)"
      - "MultiTierModelClient tries tiers in order with asyncio.wait_for timeout per tier"
      - "On success: _extract_parsed() extracts TOutput Pydantic instance"
      - "base.py writes AgentRun row to DB (agent_name, input, output, tokens, latency, status)"
      - "base.py returns TOutput to caller"
      - "caller persists business-table rows using TOutput fields"

  - name: "nvidia_circuit_breaker_trip"
    description: "What happens when NVIDIA tiers fail 5 times consecutively"
    steps:
      - "MultiTierModelClient: NVIDIA Ultra fails (timeout/error) → nvidia_failures=1"
      - "MultiTierModelClient: NVIDIA Lightning fails → nvidia_failures=2 == nvidia_tier_count"
      - "_nvidia_circuit_breaker.record_nvidia_both_failed() increments consecutive_failures"
      - "After 5 such calls: consecutive_failures >= threshold → open_until = now + 120s"
      - "Next call: circuit_breaker.is_open=True → start_tier = nvidia_tier_count (skip NVIDIA)"
      - "Haiku tier handles all calls until open_until expires (lazy reset on next is_open check)"

  - name: "nvidia_json_normalisation"
    description: "How NVIDIA Nemotron output is coerced to valid Pydantic"
    steps:
      - "NVIDIAMessagesClient.parse() builds system prompt with _build_nvidia_output_instruction()"
      - "Calls openai.AsyncOpenAI.chat.completions.create() (no response_format)"
      - "_strip_thinking_tags() removes <think>...</think> blocks"
      - "_extract_json_from_content() handles markdown fences and prose-prefixed JSON"
      - "json.loads() parses the extracted JSON"
      - "_normalize_json_keys() strips trailing ': ' from key names (Nemotron quirk)"
      - "output_format.model_validate() validates against Pydantic schema"

integration_points:
  - target: "Anthropic API"
    mechanism: "anthropic.AsyncAnthropic.messages.parse() with structured outputs"
    direction: "outbound"
  - target: "NVIDIA NIM API"
    mechanism: "openai.AsyncOpenAI.chat.completions.create() at integrate.api.nvidia.com/v1"
    direction: "outbound"
  - target: "db (agent_runs table)"
    mechanism: "SQLAlchemy AsyncSession — AgentRun row written by base.py on every run()"
    direction: "outbound"
  - target: "MCP servers"
    mechanism: "anthropic[mcp] client-side stdio pattern for usage_signal and curriculum_planner"
    direction: "inbound"

known_issues:
  - description: "create_haiku_only_client() bypasses the free NVIDIA tier entirely"
    severity: "high"
    workaround: "Always use create_model_client() — it already handles large-output workloads via the multi-tier chain"
  - description: "NVIDIA response JSON keys sometimes have trailing ': ' (e.g. 'item_type: ')"
    severity: "medium"
    workaround: "_normalize_json_keys() in model_client.py handles this; ensure new agents use the shared client"
  - description: "NvidiaCircuitBreaker state is in-process memory only — resets on server restart"
    severity: "low"
    workaround: "Acceptable for current deployment; would need Redis for multi-process circuit breaker"

patterns:
  - name: "structured-output-protocol"
    description: "Agents set output_model = PydanticClass; base.py passes it as output_format to parse(); callers read TOutput fields directly — no dict unpacking"
    example_file: "backend/app/agents/base.py:49"
  - name: "prompt-file-loading"
    description: "PROMPTS_DIR constant points to agents/prompts/; Agent.__init__ reads the .md file by self.name at instantiation"
    example_file: "backend/app/agents/base.py:42"

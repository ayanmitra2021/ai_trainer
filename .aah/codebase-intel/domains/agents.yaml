domain: "agents"
last_updated: "2026-08-31T00:00:00Z"
last_updated_after_feature: "brownfield_import"

narrative: |
  The agent domain contains the base Agent ABC, the multi-tier model client, and 14+ LLM-backed
  agent implementations. Each agent is a typed, single-purpose unit with a Pydantic input model,
  a Pydantic output model, and one system prompt file. The MultiTierModelClient provides a
  provider-agnostic interface with a 3-tier fallback chain and an in-memory NvidiaCircuitBreaker.
  No agent imports or calls another agent — that boundary is enforced by convention in base.py.

